apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-deployment
  namespace: application
spec:
  replicas: 1 # You can specify how many Pod replicas you want
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
        version: v2
    spec:
      containers:
        - name: playground
          image: wil42/playground:v1

