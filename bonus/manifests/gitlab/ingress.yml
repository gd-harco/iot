apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gitlab-ingress
  annotations:
    traefik.ingress.kubernetes.io/router.tls: "false"
spec:
  rules:
  - host: gitlab.iot.local 
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: gitlab-webservice-default
            port:
              number: 8181
