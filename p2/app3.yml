apiVersion: apps/v1
kind: Deployment
metadata:
  name: app3-pod
  namespace: inception-of-things
  labels:
    app: app3
spec:
  selector:
    matchLabels:
      app: helloworld
  replicas: 1
  template:
    metadata:
      labels:
        app: helloworld
    spec:
      containers:
      - name: tetris
        image: uzyexe/tetris:latest
        ports:
        - containerPort: 80

---

apiVersion: v1
kind: Service
metadata:
  name: app3-service
  namespace: inception-of-things
spec:
  type: ClusterIP
  selector:
    app: app3
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80

