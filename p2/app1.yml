apiVersion: apps/v1
kind: Deployment
metadata:
  name: app1-pod
  namespace: inception-of-things
  labels:
    app: app1
spec:
  selector:
    matchLabels:
      app: helloworld
  replicas: 1
  template:
    metadata:
      labels:
        app: helloworld
    spec:
      containers:
      - name: sample-page
        image: modem7/docker-rickroll:latest
        ports:
        - containerPort: 8080

---

apiVersion: v1
kind: Service
metadata:
  name: app1-service
  namespace: inception-of-things
spec:
  selector:
    app: app1
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
  type: ClusterIP
