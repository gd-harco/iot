apiVersion: v1
kind: Pod
metadata:
  name: app1-pod
  namespace: inception-of-things
  labels:
    app: app1
spec:
  containers:
    - name: sample-page
      image: modem7/docker-rickroll:latest
      ports:
        - containerPort: 8080

---

apiVersion: v1
kind: Service
metadata:
  name: app1-service
  namespace: inception-of-things
spec:
  selector:
    app: app1
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
  type: ClusterIP
