apiVersion: apps/v1
kind: Deployment
metadata:
  name: app2-pod
  namespace: inception-of-things
spec:
  selector:
    matchLabels:
      app: helloworld
  replicas: 3
  template:
    metadata:
      labels:
        app: helloworld
    spec:
      containers:
      - name: helloworld
        image: karthequian/helloworld:latest
        ports:
        - containerPort: 80

---

apiVersion: v1
kind: Service
metadata:
  name: app2-service
  namespace: inception-of-things
spec:
  type: ClusterIP
  selector:
    app: helloworld
  ports:
    - port: 80
      targetPort: 80
