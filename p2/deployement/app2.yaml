apiVersion: v1
kind: Service
metadata:
  name: app2-service
spec:
  selector:
    app: app2
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app2-deployment
spec:
  replicas: 3 # You can specify how many Pod replicas you want
  selector:
    matchLabels:
      app: app2
  template:
    metadata:
      labels:
        app: app2
        version: v1
    spec:
      containers:
        - name: hello
          image: paulbouwer/hello-kubernetes:1.10
          env:
            - name: MESSAGE
              value: "hello from app 2"

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app2

spec:
  rules:
    - host: app2.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: app2-service
                port:
                  number: 80
