apiVersion: v1
kind: Service
metadata:
  name: app1-service
spec:
  selector:
    app: app1
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app1-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app1
  template:
    metadata:
      labels:
        app: app1
        version: v1
    spec:
      containers:
        - name: hello
          image: paulbouwer/hello-kubernetes:1.10
          env:
            - name: MESSAGE
              value: "hello from app 1"

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app1

spec:
  rules:
    - host: app1.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: app1-service
                port:
                  number: 80
