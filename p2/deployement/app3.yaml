apiVersion: v1
kind: Service
metadata:
  name: app3-service
spec:
  selector:
    app: app3
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app3-deployment
spec:
  replicas: 1 # You can specify how many Pod replicas you want
  selector:
    matchLabels:
      app: app3
  template:
    metadata:
      labels:
        app: app3
        version: v1
    spec:
      containers:
        - name: hello
          image: paulbouwer/hello-kubernetes:1.10
          env:
            - name: MESSAGE
              value: "hello from app 3"

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app3

spec:
  rules:
    - host: app3.com
      http:
        paths:
          - path: /
            pathType: Exact
            backend:
              service:
                name: app3-service
                port:
                  number: 80
