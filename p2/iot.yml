apiVersion: v1
kind: Namespace
metadata:
  name: inception-of-things

---

apiVersion: v1
kind: Pod
metadata:
  name: app1-pod
  namespace: inception-of-things
spec:
  containers:
    - name: sample-page
      image: modem7/docker-rickroll:latest
      ports:
        - containerPort: 8080
---

apiVersion: v1
kind: Pod
metadata:
  name: app2-pod
  namespace: inception-of-things
spec:
  containers:
    - name: tetris
      image: uzyexe/tetris:latest
      ports:
        - containerPort: 80

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: third-app
  namespace: inception-of-things
spec:
  selector:
    matchLabels:
      app: helloworld
  replicas: 3 # tells deployment to run 3 pods matching the template
  template: # create pods using pod definition in this template
    metadata:
      labels:
        app: helloworld
    spec:
      containers:
      - name: helloworld
        image: karthequian/helloworld:latest
        #ports:
        #  - protocol: TCP
        #    port: 8000
        #    targetPort: 80


